name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # The repo's default token is read-only, which is the right default: only the release
    # step needs more, and it fails with "Resource not accessible by integration" without
    # this. Granting it here keeps the permission scoped to this workflow rather than
    # widening it account-wide.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Uses the wrapper, not the runner's `gradle`, so CI and local builds run the same
      # Gradle. AGP 9 is strict about this: it rejects Gradle versions either side of a
      # narrow range, and the runner's version is not ours to control.
      - uses: gradle/actions/setup-gradle@v4

      # The signing key reaches the runner only on a tag, so ordinary pushes and pull
      # requests never handle it. They build an unsigned release APK, which is still enough
      # to verify minification, lint, and size.
      #
      # Needs all three of SIGNBOARD_RELEASE_KEYSTORE (base64 of
      # ~/.android/signboard-release.keystore), SIGNBOARD_KEYSTORE_PASSWORD, and
      # SIGNBOARD_KEY_PASSWORD. Missing any one of them yields an unsigned build, because
      # build.gradle.kts reads the passwords from the environment with no fallback.
      - name: Decode release keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE: ${{ secrets.SIGNBOARD_RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SIGNBOARD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNBOARD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/signboard-release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets are incomplete; the release APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check
        env:
          SIGNBOARD_KEYSTORE_PASSWORD: ${{ secrets.SIGNBOARD_KEYSTORE_PASSWORD }}
          SIGNBOARD_KEY_PASSWORD: ${{ secrets.SIGNBOARD_KEY_PASSWORD }}
        run: ./scripts/check.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release bundle
        env:
          SIGNBOARD_KEYSTORE_PASSWORD: ${{ secrets.SIGNBOARD_KEYSTORE_PASSWORD }}
          SIGNBOARD_KEY_PASSWORD: ${{ secrets.SIGNBOARD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # An unsigned build succeeds and looks normal, so the signature is checked rather than
      # assumed. The fingerprint is the certificate registered for Android developer
      # verification; publishing anything else would ship an APK that won't install on
      # certified devices from Sep 30, 2026. See AGENTS.md.
      - name: Verify release signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs build/outputs/apk/release/*.apk | tee certs.txt
          grep -qi 'SHA-256 digest: 43bd1f9bef817d28324d885f72bc4252f52c178d330dd07577340137f4e40cc4' certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signboard-apk
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signboard-bundle
          path: build/outputs/bundle/release/*.aab

      # Only publish artifacts anyone can actually install. An unsigned APK on a release
      # page is worse than no APK.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/outputs/apk/release/*.apk
            build/outputs/bundle/release/*.aab
          body: |
            Install from [Google Play](https://play.google.com/store/apps/details?id=com.veszelovszki.signboard) unless you specifically want the APK.

            **This APK and the Play build are signed with different keys**, so Android won't update one into the other. Moving between them means uninstalling first, which clears your saved texts.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
